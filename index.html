<style>:root{--bg:#0C0B0A;--fg:#F6EEE3;--y:#FFC46B;--mute:#9b9186;--line:#2a2622}*{box-sizing:border-box}
html{background:var(--bg)}body{margin:0;color:var(--fg);font:16px/1.6 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.d{font-family:Fraunces,Georgia,serif;font-weight:400;font-variation-settings:'opsz' 9,'SOFT' 0,'WONK' 0;letter-spacing:-.01em;line-height:1.08;margin:0}
.mono{font-family:'Space Mono',ui-monospace,monospace;letter-spacing:.18em;font-size:12px;text-transform:uppercase;color:var(--mute)}

form{display:flex;gap:8px;max-width:420px;width:100%} input{flex:1;min-width:0;background:#171513;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:13px 18px;font:inherit}

.counter{display:flex;align-items:center;gap:12px;color:var(--y)} .counter i{width:7px;height:7px;border-radius:50%;background:var(--y)} .counter b{display:block;width:120px;height:1px;background:var(--y);opacity:.5}

html,body{height:100%}
body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;text-align:center;padding:clamp(56px,9svh,96px) 24px clamp(40px,7svh,80px)}
@supports(height:100dvh){body{height:100dvh;min-height:100dvh}}
.vf{position:fixed;inset:clamp(12px,3.2svh,28px);pointer-events:none} .vf span{position:absolute;width:28px;height:28px;border-color:#3a3530;border-style:solid;border-width:0}
.vf .a{left:0;top:0;border-left-width:1px;border-top-width:1px}.vf .b{right:0;top:0;border-right-width:1px;border-top-width:1px}
.vf .c{left:0;bottom:0;border-left-width:1px;border-bottom-width:1px}.vf .e{right:0;bottom:0;border-right-width:1px;border-bottom-width:1px}
main{flex:1 1 auto;min-height:0;max-width:520px;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ico{width:clamp(60px,12svh,104px);height:auto}

p.body{color:var(--mute);margin:0 0 clamp(14px,3.6svh,32px);max-width:440px;font-size:clamp(14px,2.2svh,16px);line-height:1.5}
small{margin-top:clamp(8px,1.5svh,12px);color:var(--mute);font-size:13px} footer{flex:none;font-size:13px;color:var(--mute);margin-top:clamp(10px,2svh,24px)}
.meta{position:fixed;top:clamp(24px,5.5svh,44px);left:56px;right:56px;display:flex;justify-content:space-between}
@media(max-width:600px){.meta{left:32px;right:32px}}
@media(max-height:620px){input,button{padding-top:10px;padding-bottom:10px}.mono{font-size:11px}}
