<style>:root{--bg:#0C0B0A;--fg:#F6EEE3;--y:#FFC46B;--mute:#9b9186;--line:#2a2622}*{box-sizing:border-box}

.d{font-family:Fraunces,Georgia,serif;font-weight:400;font-variation-settings:'opsz' 9,'SOFT' 0,'WONK' 0;letter-spacing:-.01em;line-height:1.08;margin:0}
.mono{font-family:'Space Mono',ui-monospace,monospace;letter-spacing:.18em;font-size:12px;text-transform:uppercase;color:var(--mute)}
.ico{border-radius:22.37%;display:block} a{color:inherit} .mute{color:var(--mute)}
